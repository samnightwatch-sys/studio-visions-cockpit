<!doctype html>
<html lang="fr-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poste de pilotage — Studio Visions</title>
<meta name="description" content="Studio Visions, agence de pub complète : print de luxe, sites, campagnes, pitchs, et l'IA pour aller plus vite. La Roche-en-Ardenne et Bruxelles.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio Visions">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Crect x='3.5' y='3.5' width='25' height='25' fill='none' stroke='%23eaf2ff'/%3E%3Ctext x='16' y='21' font-family='Helvetica,Arial' font-size='12' font-weight='700' fill='%23fff' text-anchor='middle'%3ESV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/v7.css?v=8.6.4">
<link rel="stylesheet" href="css/oracle.css?v=8.6.4">
<link rel="stylesheet" href="css/deck.css?v=8.6.4">
</head>
<body>
<canvas id="terrain" aria-hidden="true"></canvas>

<section id="boot" class="screen" aria-label="Démarrage" hidden>
  <div class="log" aria-hidden="true"></div>
  <div class="presents" aria-hidden="true"><p></p><span class="jp">夜警</span></div>
</section>
<section id="title" class="screen" aria-label="Écran titre" hidden></section>
<section id="oath" class="screen" aria-label="Le serment de la Nightwatch" hidden></section>
<div id="hq" class="screen" hidden></div>
<section id="oracle" class="screen" aria-label="L'Oracle" hidden></section>

<div id="dossier" role="dialog" aria-modal="true" aria-label="Dossier d'opération" hidden></div>
<div id="tx" role="dialog" aria-label="Transmission entrante" hidden></div>
<div id="cmd" role="dialog" aria-label="Ligne de commande" hidden></div>
<button id="skip" class="skip" type="button" hidden>PASSER [ÉCHAP]</button>
<!-- un seul bouton pour le son et la voix, visible sur tous les écrans -->
<button id="snd" class="sndpill" type="button" data-on="1" hidden><i class="ic" aria-hidden="true"></i><span class="eq" aria-hidden="true"><b></b><b></b><b></b></span><span class="lb"></span></button>
<!-- les quatre visions du poste : claire, nuit, thermique, rouge -->
<div id="vis" class="vis" role="radiogroup" aria-label="Vision" hidden></div>
<!-- vision thermique : les photos passent du froid (indigo) au chaud (jaune) selon leur lumière -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="thermal" color-interpolation-filters="sRGB">
  <feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0"/>
  <feComponentTransfer>
    <feFuncR type="table" tableValues="0.02 0.25 0.75 1 1 1"/>
    <feFuncG type="table" tableValues="0.01 0.02 0.08 0.45 0.85 1"/>
    <feFuncB type="table" tableValues="0.12 0.55 0.45 0.05 0.15 0.9"/>
  </feComponentTransfer></filter></svg>
<style>body.vis-thermal img,body.vis-thermal video{filter:url(#thermal)!important}</style>
<div id="curtain" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><span class="msg"></span></div>
<div id="flash" class="flash" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<div class="crt" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="nvfx" aria-hidden="true"></div>

<noscript>
  <div style="position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:system-ui,sans-serif">
    <p>Studio Visions — le studio IA de Night Watch Forces.<br>Active JavaScript pour entrer au poste de pilotage, ou écris à <a href="mailto:sam@studiovisions.io" style="color:#fff">sam@studiovisions.io</a>.</p>
  </div>
</noscript>
<script src="js/content.js?v=8.6.4"></script>
<script src="js/fx.js?v=8.6.4"></script>
<script src="js/adn.js?v=8.6.4"></script>
<script src="js/voice.js?v=8.6.4"></script>
<script src="js/catalogue.js?v=8.6.4"></script>
<script src="js/oracle.js?v=8.6.4"></script>
<script src="js/app.js?v=8.6.4"></script>
</body>
</html>
